openapi: 3.0.3
info:
  title: AI Test Lab API
  description: AI自動テスト検証環境のAPIスペック。認証・フォームバリデーション・管理者機能を提供する。
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: ローカル開発環境

tags:
  - name: auth
    description: 認証・セッション管理 (NextAuth.js)
  - name: validate
    description: フォームバリデーション (認証済みユーザー)
  - name: admin
    description: 管理者機能 (Adminロール専用)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth.js が発行するJWTセッションクッキー

  schemas:
    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: メールアドレスの形式が正しくありません

    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum: [true]

    ErrorResponse:
      type: object
      required:
        - success
        - errors
      properties:
        success:
          type: boolean
          enum: [false]
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      example:
        success: false
        errors:
          - field: email
            message: メールアドレスの形式が正しくありません
          - field: age
            message: 年齢は0以上の数値を入力してください

    User:
      type: object
      required:
        - id
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
          example: clx1234abcd
        name:
          type: string
          nullable: true
          example: 佐藤 琢磨
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          enum: [ADMIN, USER]
          example: USER
        createdAt:
          type: string
          format: date-time
          example: '2026-04-23T10:00:00Z'

    Stats:
      type: object
      required:
        - totalUsers
        - activeSessions
        - totalFormSubmissions
      properties:
        totalUsers:
          type: integer
          example: 42
        activeSessions:
          type: integer
          example: 5
        totalFormSubmissions:
          type: integer
          example: 128

    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
            email:
              type: string
              format: email
            role:
              type: string
              enum: [ADMIN, USER]
        expires:
          type: string
          format: date-time

paths:
  # ----------------------------------------
  # 認証
  # ----------------------------------------
  /api/auth/session:
    get:
      tags: [auth]
      summary: 現在のセッション情報取得
      description: ログイン中ユーザーのセッション情報を返す。未認証の場合は空オブジェクトを返す。
      responses:
        '200':
          description: セッション情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                authenticated:
                  summary: 認証済み
                  value:
                    user:
                      id: clx1234abcd
                      name: 佐藤 琢磨
                      email: user@example.com
                      role: USER
                    expires: '2026-05-23T10:00:00Z'
                unauthenticated:
                  summary: 未認証
                  value: {}

  /api/auth/callback/credentials:
    post:
      tags: [auth]
      summary: メール/パスワードでログイン
      description: |
        NextAuth.js の Credentials プロバイダーによる認証エンドポイント。
        成功時はセッションクッキーをセットしてリダイレクトする。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email
                - password
                - csrfToken
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: password123
                csrfToken:
                  type: string
                  description: /api/auth/csrf から取得したCSRFトークン
      responses:
        '302':
          description: 認証成功。callbackUrl にリダイレクト
        '401':
          description: 認証失敗

  /api/auth/signout:
    post:
      tags: [auth]
      summary: ログアウト
      description: セッションクッキーを削除してログアウトする。
      security:
        - cookieAuth: []
      responses:
        '302':
          description: ログアウト成功。ログイン画面にリダイレクト

  # ----------------------------------------
  # バリデーション
  # ----------------------------------------
  /api/validate/text:
    post:
      tags: [validate]
      summary: テキスト入力バリデーション
      description: 名前・メールアドレス・年齢のバリデーションを実行する。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - age
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: 佐藤 琢磨
                email:
                  type: string
                  format: email
                  example: user@example.com
                age:
                  type: integer
                  minimum: 0
                  maximum: 150
                  example: 30
      responses:
        '200':
          description: バリデーション成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証

  /api/validate/select:
    post:
      tags: [validate]
      summary: セレクト入力バリデーション
      description: カテゴリ選択と任意の詳細説明のバリデーションを実行する。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
              properties:
                category:
                  type: string
                  enum: [categoryA, categoryB, categoryC]
                  example: categoryA
                details:
                  type: string
                  example: 詳細説明テキスト
      responses:
        '200':
          description: バリデーション成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証

  /api/validate/date:
    post:
      tags: [validate]
      summary: 日付入力バリデーション
      description: 日付形式のバリデーションを実行する。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
              properties:
                date:
                  type: string
                  format: date
                  example: '2026-04-23'
      responses:
        '200':
          description: バリデーション成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証

  /api/validate/checkbox:
    post:
      tags: [validate]
      summary: チェックボックス/スイッチ入力バリデーション
      description: 複数選択チェックボックスとトグルスイッチのバリデーションを実行する。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - toggle
              properties:
                items:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  example: [option1, option2]
                toggle:
                  type: boolean
                  example: true
      responses:
        '200':
          description: バリデーション成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証

  /api/validate/conditional:
    post:
      tags: [validate]
      summary: 条件付きバリデーション
      description: |
        カテゴリが "other" の場合、details フィールドが必須になる条件付きバリデーション。
        それ以外のカテゴリでは details は任意。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
              properties:
                category:
                  type: string
                  enum: [categoryA, categoryB, other]
                  example: other
                details:
                  type: string
                  description: category が "other" の場合は必須
                  example: その他の詳細説明
            examples:
              other_with_details:
                summary: その他（詳細あり）
                value:
                  category: other
                  details: 具体的な詳細説明
              categoryA:
                summary: カテゴリA（詳細不要）
                value:
                  category: categoryA
      responses:
        '200':
          description: バリデーション成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: バリデーションエラー（"other" 選択時に details が未入力）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                errors:
                  - field: details
                    message: 「その他」を選択した場合、詳細説明は必須です
        '401':
          description: 未認証

  # ----------------------------------------
  # 管理者
  # ----------------------------------------
  /api/admin/users:
    get:
      tags: [admin]
      summary: ユーザー一覧取得
      description: 全ユーザーの一覧を返す。Adminロールのみアクセス可能。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ユーザー一覧
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
              example:
                users:
                  - id: clx1234abcd
                    name: 管理者
                    email: admin@example.com
                    role: ADMIN
                    createdAt: '2026-04-01T09:00:00Z'
                  - id: clx5678efgh
                    name: 一般ユーザー
                    email: user@example.com
                    role: USER
                    createdAt: '2026-04-10T10:30:00Z'
        '401':
          description: 未認証
        '403':
          description: 権限なし（Userロール）

  /api/admin/stats:
    get:
      tags: [admin]
      summary: KPI統計取得
      description: ダッシュボード用の集計統計情報を返す。Adminロールのみアクセス可能。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: KPI統計
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
              example:
                totalUsers: 42
                activeSessions: 5
                totalFormSubmissions: 128
        '401':
          description: 未認証
        '403':
          description: 権限なし（Userロール）
